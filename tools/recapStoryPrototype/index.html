<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pip monthly story — format prototypes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --studio: #14110e;
      --studio-ink: #f4ead8;
      --studio-muted: #b9a990;
      --focus: #fbbf24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--studio); color: var(--studio-ink); font-family: "Hanken Grotesk", sans-serif; }
    ::selection { background: #fbbf24; color: #14110e; }
    body { padding: 48px 40px 96px; }
    header { max-width: 920px; margin-bottom: 48px; }
    h1 { font-size: 28px; letter-spacing: -0.03em; margin: 0 0 8px; }
    .lede { color: var(--studio-muted); font-size: 16px; line-height: 1.45; max-width: 62ch; margin: 0; }
    .note { margin-top: 16px; font-size: 13px; color: var(--studio-muted); }
    section { margin-bottom: 56px; }
    section h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--studio-muted); margin: 0 0 16px; }
    .row { display: flex; gap: 28px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x proximity; }
    .col { flex: 0 0 auto; scroll-snap-align: start; width: 240px; }
    .col figcaption { margin-top: 12px; font-size: 13px; line-height: 1.35; color: var(--studio-muted); }
    .col strong { color: var(--studio-ink); font-weight: 700; display: block; margin-bottom: 2px; }
    .phone {
      width: 240px; height: 426.67px;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
      cursor: zoom-in;
    }
    .phone:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    .stage {
      width: 360px; height: 640px;
      transform: scale(0.66667);
      transform-origin: top left;
      position: relative;
      overflow: hidden;
    }
    .ornament, .motif, .month, .wordmark, .scene { position: absolute; }
    .ornament, .motif { inset: 0; pointer-events: none; }
    .month { top: 48px; left: 32px; right: 80px; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
    .wordmark { bottom: 40px; right: 32px; font-size: 12px; font-weight: 700; }
    .scene { top: 96px; left: 32px; right: 32px; bottom: 72px; }
    .display { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.12; margin: 0; }
    .body { font-size: 16px; font-weight: 500; line-height: 1.45; margin: 16px 0 0; }
    .title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0; line-height: 1.2; }
    .num { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
    .pip { overflow: visible; }
    .hero { animation: rise 560ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero { animation: none; }
    }
    dialog { border: 0; padding: 24px; background: transparent; }
    dialog::backdrop { background: rgba(10,8,6,.82); }
    .zoom-stage { width: 270px; height: 480px; margin: 0 auto; border-radius: 4px; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,.6); }
    .zoom-stage .stage { transform: scale(0.75); }
    dialog form { text-align: center; margin-top: 16px; }
    dialog button {
      font: 700 14px "Hanken Grotesk", sans-serif;
      background: #f4ead8; color: #14110e; border: 0; border-radius: 999px;
      padding: 10px 18px; cursor: pointer;
    }
    dialog button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  </style>
</head>
<body>
  <!--
    THESIS: Same Pip story chrome, a different hero graphic per data-picked episode — not a new costume and not twelve unrelated issues.
    OWN-WORLD: September Mid-Autumn palettes, kinetic starburst + cropped ring, Hanken Grotesk / Space Grotesk, gold coin Pip.
    STORY: January and June should fail a side-by-side “same layout” test while still reading as the recap in one second.
    FIRST VIEWPORT: Identity row, then middle-hero row, then the shared finale stamp.
    FORM: Throwaway board. Not production RecapStoryFrame.
    FINISH: unreviewed and undocumented is unfinished; this build ends with a visual pass in the browser.
  -->
  <header>
    <h1>Monthly story formats</h1>
    <p class="lede">September’s costume on every card — moon, amber, mooncake. Default is the layout shipping today. The other four change only the inner composition.</p>
    <p class="note">Throwaway prototype. Click a card to view at 360×640. Not wired to the app.</p>
  </header>
  <main id="board"></main>
  <dialog id="zoom">
    <div class="zoom-stage" id="zoomStage"></div>
    <form method="dialog"><button>Close</button></form>
  </dialog>
  <script>
    const P = {
      identity: { bg: "#78350F", ink: "#FFFBEB", accent: "#FDE68A" },
      pattern:  { bg: "#3B1F04", ink: "#FFFBEB", accent: "#FCD34D" },
      spotlight:{ bg: "#181E34", ink: "#FFFBEB", accent: "#FDE047" },
      habit:    { bg: "#E2E8F0", ink: "#1E293B", accent: "#475569" },
      finale:   { bg: "#0F172A", ink: "#FFFFFF", accent: "#FBBF24" },
    };

    function pip(w = 168) {
      const h = Math.round(w * 1.16);
      return `
        <svg class="pip" width="${w}" height="${h}" viewBox="0 0 120 140" aria-hidden="true">
          <path d="M60 28 C60 12 50 4 42 4 C54 0 66 14 66 30" fill="#1c7a4e"/>
          <path d="M60 28 C60 10 74 2 84 8 C76 12 66 20 60 32" fill="#2aab68"/>
          <path d="M60 28 L60 46" stroke="#185e3e" stroke-width="3" fill="none"/>
          <ellipse cx="60" cy="84" rx="46" ry="46" fill="#FAC438" stroke="#D99E18" stroke-width="3"/>
          <circle cx="46" cy="80" r="7" fill="#fff"/>
          <circle cx="74" cy="80" r="7" fill="#fff"/>
          <circle cx="48" cy="82" r="3.2" fill="#7A4800"/>
          <circle cx="76" cy="82" r="3.2" fill="#7A4800"/>
          <circle cx="40" cy="96" r="5.5" fill="#F07828" opacity=".55"/>
          <circle cx="80" cy="96" r="5.5" fill="#F07828" opacity=".55"/>
        </svg>`;
    }

    function mooncake() {
      return `<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true" style="position:absolute;left:54px;top:108px">
        <circle cx="18" cy="18" r="14" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
        <circle cx="18" cy="18" r="9" fill="none" stroke="#FEF3C7" stroke-width="1" stroke-dasharray="3 2"/>
      </svg>`;
    }

    function chrome(p) {
      return `
        <svg class="ornament" width="360" height="640" viewBox="0 0 360 640" aria-hidden="true">
          <path d="M284 14 L306 48 L346 36 L330 76 L366 102 L320 106 L310 150 L286 114 L246 130 L260 88 L226 62 L270 60 Z"
            transform="translate(40 -100)" fill="${p.accent}"/>
          <circle cx="-44" cy="548" r="124" fill="none" stroke="${p.accent}" stroke-width="32"/>
        </svg>
        <svg class="motif" width="360" height="640" viewBox="0 0 360 640" aria-hidden="true" opacity="0.24">
          <circle cx="300" cy="80" r="34" fill="${p.accent}"/>
          <path d="M 250 95 Q 290 85 330 100 Q 350 105 360 100" stroke="${p.ink}" stroke-width="2" fill="none" opacity="0.6"/>
        </svg>
        <div class="month" style="color:${p.ink}">September</div>
        <div class="wordmark" style="color:${p.ink}">Pip</div>`;
    }

    function frame(p, inner) {
      return `<div class="stage" style="background:${p.bg};color:${p.ink}">
        ${chrome(p)}
        <div class="scene">${inner}</div>
      </div>`;
    }

    const cards = [];

    function add(section, title, pal, html, caption) {
      cards.push({ section, title, pal, html, caption });
    }

    /* —— Identity row —— */
    add("Identity", "Default", P.identity, `
      <div style="width:296px">
        <p class="display">The Flavour Finder</p>
        <p class="body">The meals and bites you recorded gave this month its clearest flavour.</p>
      </div>
      <div style="position:absolute;bottom:0;right:-8px;width:248px;height:208px">
        ${pip(200)}${mooncake()}
      </div>`, "Today’s identity: copy on top, Pip parked bottom-right.");

    add("Identity", "Signature", P.identity, `
      <div style="width:240px;position:relative;z-index:2">
        <p class="display">The Flavour Finder</p>
        <p class="body">The meals and bites you recorded gave this month its clearest flavour.</p>
      </div>
      <div class="hero" style="position:absolute;left:-32px;right:-32px;bottom:12px;height:250px">
        <svg width="360" height="250" viewBox="0 0 360 250" aria-hidden="true">
          <ellipse cx="158" cy="178" rx="188" ry="72" fill="${P.identity.accent}"/>
          <ellipse cx="158" cy="164" rx="148" ry="52" fill="${P.identity.bg}"/>
          <ellipse cx="158" cy="156" rx="114" ry="38" fill="${P.identity.accent}" opacity=".55"/>
          <rect x="278" y="0" width="14" height="150" rx="7" fill="${P.identity.ink}"/>
          <rect x="304" y="24" width="10" height="126" rx="5" fill="${P.identity.ink}" opacity=".55"/>
        </svg>
        <div style="position:absolute;left:64px;bottom:52px">${pip(124)}${mooncake()}</div>
      </div>
    `, "Pip sits in the plate. Category geometry owns the frame.");

    add("Identity", "Cadence", P.identity, `
      <p class="display" style="width:240px">The Cool Consistent</p>
      <p class="body" style="width:220px">You left a record on 18 different days this month.</p>
      <div class="hero" style="position:absolute;left:-8px;right:-8px;bottom:0;height:188px">
        <svg width="312" height="188" viewBox="0 0 312 188" aria-hidden="true">
          ${[0,1,2,3,4,5,6].map((i) => {
            const x = 18 + i * 42;
            const on = i < 5;
            return `<rect x="${x}" y="36" width="16" height="132" rx="8" fill="${on ? P.identity.accent : "none"}" stroke="${P.identity.ink}" stroke-width="2.5"/>`;
          }).join("")}
        </svg>
        <div style="position:absolute;left:108px;bottom:40px">${pip(110)}</div>
      </div>
    `, "A week-rail behind Pip. Consistency is the architecture.");

    add("Identity", "Spotlight", P.spotlight, `
      <p class="display" style="width:240px;position:relative;z-index:2">Celebration Season</p>
      <div class="hero" style="position:absolute;left:24px;right:-40px;bottom:-24px;height:300px">
        <svg width="280" height="300" viewBox="0 0 280 300" aria-hidden="true">
          <rect x="48" y="92" width="184" height="168" rx="8" fill="${P.spotlight.accent}"/>
          <rect x="36" y="64" width="208" height="36" rx="6" fill="${P.spotlight.ink}"/>
          <rect x="128" y="64" width="28" height="196" fill="${P.spotlight.bg}"/>
          <rect x="48" y="148" width="184" height="22" fill="${P.spotlight.bg}"/>
        </svg>
        <div style="position:absolute;left:86px;top:8px">${pip(108)}</div>
      </div>
    `, "Title comes from the highlight. Pip rides the object, not a persona slot.");

    add("Identity", "Chapter", P.identity, `
      <div class="hero" style="position:absolute;right:-24px;top:-40px;opacity:.9">
        <svg width="180" height="180" viewBox="0 0 180 180" aria-hidden="true">
          <circle cx="110" cy="70" r="70" fill="${P.identity.accent}"/>
        </svg>
      </div>
      <div style="position:absolute;left:0;bottom:12px;width:200px">
        <div style="transform:scale(.72);transform-origin:left bottom">${pip(96)}</div>
        <p class="display" style="font-size:26px;margin-top:8px">A Small Chapter</p>
        <p class="body" style="margin-top:8px">The moments you chose to record became this month’s small chapter.</p>
      </div>
    `, "Quiet issue: the moon is large, Pip and type stay small.");

    /* —— Middle heroes —— */
    add("Middle", "Default · pattern", P.pattern, `
      <p class="display" style="width:280px">Food</p>
      <div style="position:absolute;top:104px;right:8px;transform:rotate(12deg)">
        <svg width="96" height="120" viewBox="0 0 96 120" aria-hidden="true">
          <rect x="18" y="8" width="6" height="36" rx="2" fill="${P.pattern.ink}"/>
          <rect x="30" y="8" width="6" height="36" rx="2" fill="${P.pattern.ink}"/>
          <rect x="42" y="8" width="6" height="36" rx="2" fill="${P.pattern.ink}"/>
          <rect x="22" y="40" width="22" height="72" rx="8" fill="${P.pattern.ink}"/>
          <rect x="64" y="8" width="10" height="100" rx="4" fill="${P.pattern.ink}"/>
          <path d="M62 18 H86 L78 48 H64 Z" fill="${P.pattern.ink}"/>
        </svg>
      </div>
      <div style="position:absolute;top:244px;left:0;right:0">
        <p class="display num" style="font-size:44px;line-height:1;margin:0 0 8px">62%</p>
        <p class="title">of recorded spending</p>
        <p class="body">Higher than last month’s recorded share · 48%</p>
      </div>
    `, "Control: title, tilted icon, percentage stack.");

    add("Middle", "Signature · pattern", P.pattern, `
      <p class="display">Food</p>
      <p class="body" style="margin-top:8px">of recorded spending</p>
      <div class="hero" style="position:absolute;left:56px;right:-16px;top:96px;bottom:-16px">
        <svg width="240" height="360" viewBox="0 0 240 360" aria-hidden="true">
          <rect x="44" y="8" width="152" height="344" rx="76" fill="none" stroke="${P.pattern.ink}" stroke-width="8"/>
          <clipPath id="jar"><rect x="52" y="16" width="136" height="328" rx="68"/></clipPath>
          <g clip-path="url(#jar)">
            <rect x="52" y="140" width="136" height="204" fill="${P.pattern.accent}"/>
          </g>
        </svg>
        <p class="display num" style="position:absolute;left:68px;bottom:88px;font-size:56px;line-height:.9;margin:0;color:${P.pattern.bg}">62%</p>
      </div>
    `, "Share as a vessel fill. Habit is gone. One middle hero.");

    add("Middle", "Cadence · habit", P.habit, `
      <p class="display num">18 active days</p>
      <p class="title" style="margin-top:12px">4 active weeks</p>
      <div class="hero" style="position:absolute;left:-8px;right:-8px;bottom:8px;height:220px">
        <svg width="312" height="220" viewBox="0 0 312 220" aria-hidden="true">
          ${[0,1,2,3].map((w) => {
            const y = 16 + w * 50;
            const filled = [7, 5, 4, 2][w];
            const dots = Array.from({length: 7}, (_, d) => {
              const x = 22 + d * 42;
              const on = d < filled;
              return `<circle cx="${x}" cy="${y+18}" r="11" fill="${on ? P.habit.accent : "none"}" stroke="${P.habit.ink}" stroke-width="2.5"/>`;
            }).join("");
            return `<line x1="10" y1="${y+18}" x2="302" y2="${y+18}" stroke="${P.habit.ink}" stroke-width="2" opacity=".35"/>${dots}`;
          }).join("")}
        </svg>
      </div>
    `, "Four week-rails, not the 28-cell grid with a check.");

    add("Middle", "Spotlight · hero", P.spotlight, `
      <div class="hero" style="position:absolute;inset:-24px -40px 40px -24px">
        <svg width="360" height="420" viewBox="0 0 360 420" aria-hidden="true">
          <rect x="58" y="120" width="244" height="260" rx="10" fill="${P.spotlight.accent}"/>
          <rect x="42" y="78" width="276" height="52" rx="8" fill="${P.spotlight.ink}"/>
          <rect x="166" y="78" width="36" height="302" fill="${P.spotlight.bg}"/>
          <rect x="58" y="228" width="244" height="28" fill="${P.spotlight.bg}"/>
        </svg>
      </div>
      <div style="position:absolute;left:0;right:0;bottom:0">
        <p class="display">Celebration Season</p>
        <p class="body" style="margin-top:8px">Thoughtful gifts and celebrations made special moments for family and friends.</p>
      </div>
    `, "Billboard object. Pattern dropped. No spotlight pill.");

    add("Middle", "Chapter · skip or one beat", P.spotlight, `
      <div class="hero" style="position:absolute;right:12px;top:32px">
        <svg width="112" height="128" viewBox="0 0 112 128" aria-hidden="true">
          <rect x="20" y="44" width="72" height="66" rx="6" fill="${P.spotlight.accent}"/>
          <rect x="14" y="30" width="84" height="16" rx="4" fill="${P.spotlight.ink}"/>
          <rect x="52" y="30" width="10" height="80" fill="${P.spotlight.bg}"/>
        </svg>
      </div>
      <div style="position:absolute;left:0;bottom:12px;width:228px">
        <p class="display" style="font-size:28px">Celebration Season</p>
        <p class="body">Thoughtful gifts and celebrations made special moments for family and friends.</p>
      </div>
    `, "Sparse + highlight stays Chapter. Same copy, small object, then finale.");

    /* —— Finale —— */
    const months = "JFMAMJJASOND".split("");
    const filledThrough = 9;
    add("Finale", "Every format", P.finale, `
      <div style="display:flex;flex-direction:column;justify-content:center;gap:20px;height:100%">
        <div style="width:272px;border:2px solid ${P.finale.ink};border-radius:24px;padding:16px;transform:rotate(-4deg);align-self:flex-start">
          <p class="title">Four-week rhythm</p>
          <p class="body" style="margin-top:8px">Your records reached four different weeks this month.</p>
        </div>
        <div style="width:272px;border:2px solid ${P.finale.ink};border-radius:24px;padding:16px;transform:rotate(4deg);align-self:flex-end">
          <p class="title">Five in the mix</p>
          <p class="body" style="margin-top:8px">You recorded at least five expenses this month.</p>
        </div>
        <div class="hero" style="margin-top:4px">
          <svg width="296" height="56" viewBox="0 0 296 56" aria-hidden="true">
            ${months.map((letter, i) => {
              const x = 14 + i * 24;
              const on = i < filledThrough;
              const current = i === filledThrough - 1;
              const r = current ? 9 : 7;
              return `
                <circle cx="${x}" cy="16" r="${r}" fill="${on ? P.finale.accent : "none"}" stroke="${P.finale.ink}" stroke-width="${current ? 3 : 2}"/>
                <text x="${x}" y="48" text-anchor="middle" font-size="11" font-family="Hanken Grotesk, sans-serif" font-weight="700" fill="${P.finale.ink}" opacity="${on ? 1 : 0.4}">${letter}</text>`;
            }).join("")}
          </svg>
        </div>
      </div>
    `, "Badges stay. As-of September, 2026: nine filled marks, October–December hollow. Re-watching this card later does not fill them.");

    const sections = ["Identity", "Middle", "Finale"];
    const board = document.getElementById("board");
    for (const name of sections) {
      const sec = document.createElement("section");
      const h = document.createElement("h2");
      h.textContent = name;
      sec.appendChild(h);
      const row = document.createElement("div");
      row.className = "row";
      cards.filter((c) => c.section === name).forEach((c, i) => {
        const col = document.createElement("figure");
        col.className = "col";
        const btn = document.createElement("button");
        btn.className = "phone";
        btn.type = "button";
        btn.setAttribute("aria-label", `Open ${c.title} at full size`);
        btn.innerHTML = frame(c.pal, c.html);
        btn.addEventListener("click", () => openZoom(c));
        const cap = document.createElement("figcaption");
        cap.innerHTML = `<strong>${c.title}</strong>${c.caption}`;
        col.append(btn, cap);
        row.appendChild(col);
      });
      sec.appendChild(row);
      board.appendChild(sec);
    }

    const dialog = document.getElementById("zoom");
    const zoomStage = document.getElementById("zoomStage");
    function openZoom(c) {
      zoomStage.innerHTML = frame(c.pal, c.html);
      zoomStage.style.background = c.pal.bg;
      dialog.showModal();
    }
  </script>
</body>
</html>
